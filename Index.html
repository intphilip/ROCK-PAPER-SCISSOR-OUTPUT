<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - Best of 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Rock, Paper, Scissors</h1>
        <p style="color: #94a3b8; font-size: 0.8rem; margin-bottom: 10px;">First to 3 Wins the Series</p>
        
        <div class="scoreboard">
            <div class="score-box">
                <p>PLAYER</p>
                <span id="player-score">0</span>
            </div>
            <div class="score-box">
                <p>COMPUTER</p>
                <span id="comp-score">0</span>
            </div>
        </div>

        <div class="choices">
            <button onclick="playGame('rock')" class="choice-btn">✊</button>
            <button onclick="playGame('paper')" class="choice-btn">✋</button>
            <button onclick="playGame('scissors')" class="choice-btn">✌️</button>
        </div>

        <div class="result-area">
            <p id="user-move">Your Move: -</p>
            <p id="computer-move">Computer Move: -</p>
            <h2 id="winner-text">Choose your weapon!</h2>
        </div>
        
        <button id="reset-btn" onclick="resetGame()">Manual Reset</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
